#  The no-game checks (SPEC.md 21.7 step 2): the unit tests, on the package as pip installs it with what it stands on.
name: unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: The package, with worktoy, mcdex and unittas
        run: python -m pip install .
      - name: The unit tests
        run: python -m unittest discover -s tests/unit
